<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#15151A" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>
  </defs>
  <!-- Derin Siyah (Deep Obsidian) Zemin -->
  <rect width="512" height="512" rx="116" fill="url(#obsidianBg)" />
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#22222A" stroke-width="4" />

  <!-- 5 Renkli Olimpiyat Halkası -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Alt Sıra: Sarı (#FCB131) ve Yeşil (#00A651) -->
    <circle cx="191" cy="296" r="58" stroke="#FCB131" stroke-width="15" />
    <circle cx="321" cy="296" r="58" stroke="#00A651" stroke-width="15" />

    <!-- Üst Sıra: Mavi (#0081C8), Siyah (#000000 + Gümüş Dış Kontur), Kırmızı (#EE334E) -->
    <circle cx="126" cy="222" r="58" stroke="#0081C8" stroke-width="15" />

    <!-- Ortadaki Siyah Halka için Koyu Zeminde Görünürlük Konturu (1.5px Yarı Saydam Beyaz Halo) -->
    <circle cx="256" cy="222" r="58" stroke="rgba(244, 244, 246, 0.55)" stroke-width="18.5" />
    <circle cx="256" cy="222" r="58" stroke="#000000" stroke-width="15" />

    <circle cx="386" cy="222" r="58" stroke="#EE334E" stroke-width="15" />
  </g>
</svg>
